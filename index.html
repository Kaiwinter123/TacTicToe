<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0;padding:0}*{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TacTicToe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: floodlit matchday — a sticky club bar over one working view at a time (club, packs, squad pitch, table, fixtures); overlays for pack openings and live matches. Single dark look by choice. */
:root{
  --night:#0c1320; --stand:#151f31; --stand2:#1b2840; --line:#28364f;
  --chalk:#eef2f7; --muted:#8e9ab0; --flood:#f4c84b; --flood-ink:#1a1405;
  --turf:#1d6644; --turf2:#1a5c3d; --win:#43c383; --draw:#d2ac4a; --loss:#e8634f;
  --bronze:#b97a4c; --silver:#b9c3d0; --gold:#e9c45c; --elite:#c63c5c;
  --c-money:#43c383; --c-blue:#3aa0ff; --c-purple:#a579ff; --c-pink:#ff5c8a; --c-teal:#2bd4c0; --c-orange:#ff8a3c;
  --display:"Big Shoulders Display","Impact","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(ellipse 70% 40% at 8% -5%,rgba(58,160,255,.14),transparent 68%),radial-gradient(ellipse 70% 40% at 92% -5%,rgba(165,121,255,.13),transparent 68%),radial-gradient(ellipse 90% 50% at 50% 108%,rgba(43,212,192,.10),transparent 70%),radial-gradient(ellipse 60% 30% at 50% 40%,rgba(244,200,75,.05),transparent 70%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--flood);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:900;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance;text-transform:uppercase}
h2{background:linear-gradient(92deg,var(--flood),var(--c-orange) 70%,var(--c-pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-family:var(--num);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--stand2);padding:10px 16px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--flood);color:var(--flood-ink);border-color:var(--flood);font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;padding:10px 22px}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{border-color:var(--loss);color:var(--loss);background:transparent}
.btn.coffee{background:#ffdd00;color:#1a1405;border-color:#ffdd00;font-weight:700;text-decoration:none}
.btn.coffee:hover{filter:brightness(1.05);border-color:#ffdd00}
.btn.coffee.tiny{padding:3px 9px;font-size:11px;border-radius:7px;align-self:flex-start}
.brand{display:flex;flex-direction:column;gap:5px;min-width:0}
.brandname{font-family:var(--display);font-weight:900;font-size:26px;text-transform:uppercase;line-height:.85;letter-spacing:.01em}
.brandname span{color:var(--flood)}
@media (max-width:560px){.brandname{font-size:22px}}
.coffee-link{display:inline-block;margin-top:4px;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.coffee-link:hover{color:var(--flood)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,rgba(28,24,10,.96),rgba(12,19,32,.92));backdrop-filter:blur(8px);border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--c-blue),var(--c-purple),var(--flood),var(--c-pink)) 1}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.club-id{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.club-id .nm{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.club-id .sub{font-size:12px;color:var(--muted)}
.stats{display:flex;gap:18px}
@media (max-width:560px){.club-id{flex-basis:100%}.stats{width:100%;justify-content:space-between}.club-id .nm{white-space:normal;font-size:20px}}
.stat .v{font-family:var(--num);font-weight:700;font-size:22px;line-height:1}
.stat .v.money{color:var(--c-money)} .stat .v.pos{color:var(--c-blue)} .stat .v.md{color:var(--c-purple)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap{display:flex;gap:4px;padding-block:0}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-family:var(--num);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-size:14px;white-space:nowrap}
.tab[aria-current="page"]{color:var(--chalk);border-image:linear-gradient(90deg,var(--c-blue),var(--c-purple),var(--flood)) 1;border-bottom-width:3px}
.tab:hover{color:var(--chalk)}
.tab.owner{color:var(--flood)}.tab.owner::before{content:"★ "}
main{padding-block:22px 60px}
.panel{position:relative;background:linear-gradient(180deg,var(--stand2),var(--stand));border:1px solid var(--line);border-radius:12px;padding:18px;overflow:hidden}
.panel::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c-blue),var(--c-teal),var(--flood),var(--c-pink));opacity:.75}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--night);padding:10px 16px;border-radius:8px;font-weight:600;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}

/* fixture hero */
.venue{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.vtag{font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.08em;padding:2px 8px;border-radius:6px;color:#0c1320}
.vtag.home{background:var(--win)} .vtag.away{background:var(--flood)}
.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:10px}
.fixture .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.fixture .side b{font-family:var(--display);font-size:24px;text-transform:uppercase;line-height:1.05}
.fixture .vs{font-family:var(--display);font-size:40px;color:var(--flood)}
.strength{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#f4c84b,#f58a3c)}
.form{display:flex;gap:4px}
.form span{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:13px;color:var(--night)}
.W{background:var(--win)}.D{background:var(--draw)}.L{background:var(--loss)}

.rule{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.h2h{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.h2hrec{font-family:var(--num);font-weight:700;font-size:14px}
.h2hrec .hw{color:var(--win)} .h2hrec .hd{color:var(--draw)} .h2hrec .hl{color:var(--loss)}
.h2hlist{display:flex;flex-direction:column;gap:4px}
.h2hrow{display:grid;grid-template-columns:1fr auto auto 26px;gap:10px;align-items:center;font-size:13px;padding:5px 8px;background:var(--stand2);border-radius:6px}
.h2hrow .res2{text-align:right;color:var(--flood)}
.rp{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:12px;color:#0c1320}
.rp.W{background:var(--win)} .rp.D{background:var(--draw)} .rp.L{background:var(--loss);color:#fff}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:560px){.split{grid-template-columns:1fr}}
.mini{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:14px;background:var(--stand2)}
.mini .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini.me{background:rgba(244,200,75,.14);color:var(--flood)}
.mini .num{min-width:30px}
/* packs */
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.pack{position:relative;border-radius:14px;padding:18px;border:1px solid var(--line);background:var(--stand);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.pack .foil{height:150px;border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden}
.pack .foil::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-40%);transition:transform .8s}
.pack:hover .foil::after{transform:translateX(40%)}
.pack .foil span{font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.04em;text-transform:uppercase;color:rgba(0,0,0,.55);mix-blend-mode:multiply}
.pack h3{font-size:24px}
.pack ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.pack .price{font-family:var(--num);font-weight:700;font-size:24px;color:var(--flood)}
.f-bronze{background:linear-gradient(135deg,#9a5a2e,#e8a265 48%,#7a4420)}
.f-silver{background:linear-gradient(135deg,#8793a3,#f0f5fb 48%,#6f7a89)}
.f-gold{background:linear-gradient(135deg,#b88718,#ffe690 48%,#9a7212)}
.f-elite{background:linear-gradient(120deg,#6d0f8a 0%,#c63c5c 38%,#f2cf6a 68%,#2aa0d6 100%)}

/* player card: club colours fill the card, rarity is the frame */
.card{--k1:#888;--k2:#444;--k3:transparent;--ink:#fff;--panel:rgba(0,0,0,.28);--rim:var(--bronze);
  position:relative;width:168px;aspect-ratio:3/4.6;max-width:100%;border-radius:14px;padding:9px 10px 8px;overflow:hidden;
  background:
    linear-gradient(118deg,transparent 0 71.5%,var(--k3) 71.5% 75.5%,transparent 75.5%) top/100% 58% no-repeat,
    linear-gradient(118deg,transparent 0 64%,var(--k2) 64% 71%,transparent 71%) top/100% 58% no-repeat,
    radial-gradient(ellipse 72% 48% at 50% 40%,rgba(255,255,255,.3),transparent 72%),
    linear-gradient(165deg,color-mix(in srgb,var(--k1) 86%,#fff) 0%,var(--k1) 36%,color-mix(in srgb,var(--k1) 50%,#000) 100%);
  color:var(--ink);display:flex;flex-direction:column;gap:3px;text-align:left;
  border:3px solid var(--rim);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.4)}
.card.silver{--rim:var(--silver)} .card.gold{--rim:var(--gold)}
.card.elite{--rim:var(--gold);box-shadow:0 0 0 2px var(--elite),0 0 26px rgba(233,196,92,.55),0 10px 30px rgba(0,0,0,.5)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.2) 44%,transparent 54%);background-size:250% 100%;background-position:100% 0}
.card.elite::after{animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{0%{background-position:100% 0}60%,100%{background-position:-60% 0}}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.card .lhs{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1}
.card .ovr{font-family:var(--num);font-weight:700;font-size:36px;line-height:.85;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.card .pos{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.08em}
.card .rar{font-family:var(--num);font-weight:700;font-size:9px;letter-spacing:.14em;padding:2px 6px;border-radius:3px;background:var(--rim);color:#1a1405;text-transform:uppercase}
.card.elite .rar{background:linear-gradient(90deg,var(--gold),#fff1b8,var(--gold))}
.card .face{flex:1;display:grid;place-items:center;min-height:0;position:relative;margin-top:-18px}
.card .face svg{width:62%;height:auto;filter:drop-shadow(0 4px 5px rgba(0,0,0,.35))}
.card .pname{text-shadow:0 1px 2px rgba(0,0,0,.25);font-family:var(--display);font-weight:900;font-size:19px;text-transform:uppercase;text-align:center;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.card .attrs{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;font-family:var(--num);font-size:11px;font-weight:600;background:var(--panel);border-radius:6px;padding:4px 8px;position:relative}
.card .attrs div{display:flex;gap:5px;align-items:baseline}
.card .attrs b{font-size:14px;min-width:18px;text-align:right}
.card .attrs span{opacity:.8;letter-spacing:.04em}
.card .foot{display:flex;justify-content:space-between;gap:6px;font-size:10px;font-weight:600;opacity:.85;position:relative}
.card .foot span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card.sm{width:104px;padding:6px 7px 6px;border-width:2px;border-radius:11px}
.card.sm .ovr{font-size:26px}.card.sm .pos{font-size:10px}.card.sm .pname{font-size:13px}
.card.sm .attrs,.card.sm .foot,.card.sm .rar{display:none}
.card.sm .face{margin-top:-10px}.card.sm .face svg{width:66%}
.card.sel{outline:3px solid var(--flood);outline-offset:3px}
.card .tag{position:absolute;top:5px;right:5px;z-index:2;background:var(--night);color:var(--flood);font-family:var(--num);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;border:1px solid var(--flood);white-space:nowrap}
.card.sm .tag{top:5px;right:4px}
@media (prefers-reduced-motion:reduce){.card.elite::after{animation:none}}

/* overlay */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(5,9,16,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.overlay::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 30%,var(--glow,rgba(244,200,75,.18)),transparent 55%)}
.overlay>*{position:relative}
.reveal{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:720px}
.flip{width:168px;aspect-ratio:3/4.6;perspective:900px}
@media (max-width:460px){.flip{width:150px}}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .back,.flip .front{position:absolute;inset:0;backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.flip .front .card{width:100%}
.flip .back{border-radius:12px 12px 22px 22px;display:grid;place-items:center;border:2px solid rgba(255,255,255,.25)}
.flip .back span{font-family:var(--display);font-size:46px;font-weight:900;color:rgba(0,0,0,.45)}
.sealed{width:200px;height:280px;border-radius:16px;display:grid;place-items:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:bob 2s ease-in-out infinite;border:0}
.sealed span{font-family:var(--display);font-size:40px;font-weight:900;color:rgba(0,0,0,.5);text-transform:uppercase;text-align:center;line-height:.95}
.sealed.shake{animation:shake .5s ease-in-out}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes shake{20%{transform:rotate(-4deg) scale(1.03)}40%{transform:rotate(4deg) scale(1.06)}60%{transform:rotate(-3deg) scale(1.08)}80%{transform:rotate(2deg) scale(1.1)}100%{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){.sealed{animation:none}.flip .in{transition:none}.sealed.shake{animation:none}}

/* scoreboard */
.board{background:#05080e;border:2px solid var(--line);border-radius:14px;padding:16px 20px;width:min(560px,100%);display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.board .tm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-family:var(--display);font-size:18px;text-transform:uppercase;line-height:1}
.board .sc{font-family:var(--num);font-weight:700;font-size:58px;color:var(--flood);line-height:1;text-align:center;letter-spacing:.04em}
.board .clk{font-family:var(--num);font-size:16px;color:var(--muted);text-align:center}
.feed{width:min(560px,100%);max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:8px 12px;background:var(--stand);border-radius:8px;border-left:3px solid var(--line);animation:in .3s ease-out}
.ev.goal{border-left-color:var(--flood)} .ev.goal.them{border-left-color:var(--loss)}
.ev .m{font-family:var(--num);font-weight:700;color:var(--muted)}
@keyframes in{from{opacity:.2;transform:translateY(6px)}}
.pbar{width:min(560px,100%);height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--flood);width:0}

/* day countdown + rest days */
.dayov{gap:16px}
.daycard{background:var(--stand);border:2px solid var(--line);border-radius:18px;padding:20px 36px;text-align:center;min-width:220px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.daycard.match{border-color:var(--flood);box-shadow:0 0 0 2px var(--flood),0 18px 50px rgba(244,200,75,.25)}
.daycard.flip{animation:dflip .22s ease}
@keyframes dflip{from{transform:perspective(600px) rotateX(50deg);opacity:.25}to{transform:none;opacity:1}}
.dayweek{font-family:var(--num);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-size:14px}
.daybig{font-family:var(--display);font-weight:900;font-size:76px;line-height:.9;color:var(--chalk)}
.daycard.match .daybig{color:var(--flood)}
.daymon{font-family:var(--num);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-size:15px}
.daylabel{font-family:var(--num);font-weight:600;font-size:18px;letter-spacing:.04em;color:var(--chalk);min-height:24px;text-align:center}
.daylabel .md{font-family:var(--display);font-size:24px;color:var(--flood);letter-spacing:.06em}
.daydots{display:flex;gap:6px}
.daydots .dot2{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s}
.daydots .dot2.on{background:var(--flood)}
.restrow{display:flex;align-items:center;gap:10px;padding:1px 14px;color:var(--muted);font-size:11px;font-family:var(--num);letter-spacing:.1em;text-transform:uppercase}
.restrow::before,.restrow::after{content:"";height:1px;background:var(--line);flex:1}
@media (prefers-reduced-motion:reduce){.daycard.flip{animation:none}}
/* momentum */
.momrow{display:flex;align-items:center;gap:10px;width:min(560px,100%)}
.momrow .marr{font-size:18px;color:var(--chalk);transition:opacity .3s,transform .3s;transform-origin:center}
.momrow .marr.big{transform:scale(1.5)}
.mbar{position:relative;flex:1;height:10px;background:var(--line);border-radius:5px;overflow:visible}
.mbar .mcenter{position:absolute;left:50%;top:-3px;width:2px;height:16px;background:rgba(255,255,255,.4);transform:translateX(-50%)}
.mbar i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;border:2px solid #05080e;transform:translate(-50%,-50%);transition:left .35s ease,background .35s;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.momcap{display:flex;justify-content:space-between;width:min(560px,100%);font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--muted)}

/* calendar */

.calgrid{display:flex;flex-direction:column;gap:3px}

/* ---------- persistence ---------- */
let saving=false, pending=false;
async function save(){
  if(!S) return;
  if(saving){pending=true;return}
  saving=true;
  try{
    const json = JSON.stringify(S);
    if(store.kind==="db"){
      await store.db.doc("data/users/"+store.uid+"/club/save").set({json, at:Date.now()});
    }else{
      try{localStorage.setItem("floodlight-save",json)}catch(e){}
    }
  }catch(e){ toast("Couldn't save just now. Your next action will try again.") }
  saving=false;
  if(store.kind==="db") writeRoster();
  if(pending){pending=false;save()}
}
async function writeRoster(){
  if(store.kind!=="db"||!S) return;
  try{
    const tbl=table(), pos=tbl.findIndex(r=>r.id==="you")+1, me=tbl[pos-1];
    const best=Math.min(pos, S.bestFinish||99, ...(S.history||[]).map(h=>h.pos));
    S.bestFinish=best;
    await store.db.doc("roster/"+store.uid).set({
      name:(store.me&&store.me.name)||"", email:(store.me&&store.me.email)||"",
      club:S.club.name, short:S.club.short, c1:S.club.c1, c2:S.club.c2,
      season:S.season, round:S.round, pts:me?me.pts:0, pos, best,
      packs:S.packs, trophies:S.trophies, updated:Date.now()
    });
  }catch(e){}
}
async function loadRoster(){
  if(store.kind!=="db"||!isAdmin){ rosterCache="na"; return }
  rosterCache=null;
  try{ const q=await store.db.collection("roster").orderBy("updated","desc").get();
    rosterCache=q.docs.map(d=>({id:d.id,...d.data()})); }
  catch(e){ rosterCache="err" }
  if(view==="admin") render();
}
async function load(){
  if(store.kind==="db"){
    const snap = await store.db.doc("data/users/"+store.uid+"/club/save").get();
    if(snap.exists){ const d=snap.data(); if(d && d.json) return JSON.parse(d.json) }
    return null;
  }
  try{const j=localStorage.getItem("floodlight-save"); return j?JSON.parse(j):null}catch(e){return null}
}

/* ---------- squad logic ---------- */
const byId = id => S.squad.find(p=>p.id===id);
function slots(){ return FORMATIONS[S.formation] }
function effective(p,slotPos){ if(!p) return 0; return p.pos===slotPos? p.ovr : p.ovr - (p.pos==="GK"||slotPos==="GK"?35:12) }
function autoPick(){
  const used=new Set(), sl=slots(), xi=sl.map(()=>null);
  sl.forEach(([pos],i)=>{
    const best=S.squad.filter(p=>!used.has(p.id)&&p.pos===pos).sort((a,b)=>b.ovr-a.ovr)[0];
    if(best){used.add(best.id); xi[i]=best.id}
  });
  sl.forEach(([pos],i)=>{
    if(xi[i]) return;
    const best=S.squad.filter(p=>!used.has(p.id)).sort((a,b)=>effective(b,pos)-effective(a,pos))[0];
    if(best){used.add(best.id); xi[i]=best.id}
  });
  S.xi = xi;
}
function teamRatings(){
  const g={GK:[],DEF:[],MID:[],FWD:[]};
  slots().forEach(([pos],i)=>{ const p=byId(S.xi[i]); g[pos].push(p?Math.max(CARE-4,effective(p,pos)):CARE) });
  const avg = a => a.length? a.reduce((x,y)=>x+y,0)/a.length : CARE;
  const all = [].concat(g.GK,g.DEF,g.MID,g.FWD);
  const fl = v => Math.max(CARE-2, v);
  return {
    att: fl(0.6*avg(g.FWD)+0.4*avg(g.MID)),
    def: fl(0.45*avg(g.DEF)+0.3*avg(g.GK)+0.25*avg(g.MID)),
    ovr: fl(avg(all))
  };
}
function ratingsFor(id){
  if(id==="you") return teamRatings();
  const t=S.teams.find(t=>t.id===id); return {att:t.str+1,def:t.str-1,ovr:t.str};
}
function teamInfo(id){
  if(id==="you") return {name:S.club.name,short:S.club.short,c1:S.club.c1,c2:S.club.c2};
  return S.teams.find(t=>t.id===id);
}
function lambdas(h,a){
  const H=ratingsFor(h), A=ratingsFor(a);
  return [clamp(1.4*Math.exp((H.att-A.def)/19)*1.08,.2,3.3), clamp(1.4*Math.exp((A.att-H.def)/19)*.92,.2,3.3)];
}

/* ---------- table ---------- */
function table(){
  const rows={};
  ["you"].concat(S.teams.map(t=>t.id)).forEach(id=>rows[id]={id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[]});
  S.results.forEach((res,r)=>res.forEach((sc,i)=>{
    if(!sc) return;
    const [h,a]=S.fixtures[r][i], H=rows[h], A=rows[a];
    H.p++;A.p++;H.gf+=sc[0];H.ga+=sc[1];A.gf+=sc[1];A.ga+=sc[0];
    if(sc[0]>sc[1]){H.w++;A.l++;H.pts+=3;H.form.push("W");A.form.push("L")}
    else if(sc[0]<sc[1]){A.w++;H.l++;A.pts+=3;H.form.push("L");A.form.push("W")}
    else{H.d++;A.d++;H.pts++;A.pts++;H.form.push("D");A.form.push("D")}
  }));
  return Object.values(rows).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||teamInfo(x.id).name.localeCompare(teamInfo(y.id).name));
}
function simRound(r,skip){
  return S.fixtures[r].map(([x,y],k)=>{ if(x==="bye"||y==="bye") return null; if(k===skip) return null; const [l1,l2]=lambdas(x,y); return [poisson(l1),poisson(l2)] });
}
// Rounds where your club sits out are played in the background.
function advanceByes(){
  let n=0;
  while(S.round<S.fixtures.length && myFixture(S.round).m.includes("bye")){ S.results[S.round]=simRound(S.round,-1); S.round++; n++ }
  return n;
}
function myFixture(r){ const i=S.fixtures[r].findIndex(m=>m.includes("you")); return {i,m:S.fixtures[r][i]} }

let toastT;
function toast(msg){
  let t=$(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600);
}

function h2hBlock(oppId){

  return `<div class="h2h">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Head to head vs ${esc(opp.short)}</span>

  </div>`;

function upcoming(){
  const out=[];
  for(let r=S.round+1;r<S.fixtures.length&&out.length<4;r++){
    const {m}=myFixture(r); if(m.includes("bye")) continue;
    const home=m[0]==="you", o=teamInfo(home?m[1]:m[0]);
    out.push(`<div class="mini"><span class="num muted">MD${r+1}</span>${crest(o.c1,o.c2,o.short,16)}<span class="grow">${esc(o.name)}</span><span class="muted">${home?"H":"A"}</span></div>`);
  }
  return out.join("")||'<p class="muted" style="margin:0">Last match of the season.</p>';
}

const CAL_WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], CAL_MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function seasonStart(){ const y=2025+S.season; let d=Date.UTC(y,7,15); while(new Date(d).getUTCDay()!==6) d+=864e5; return d; } // first Saturday on/after 15 Aug
function mDate(round){ const d=mDateObj(round); return {wd:CAL_WD[d.getUTCDay()],day:d.getUTCDate(),mo:CAL_MO[d.getUTCMonth()],yr:d.getUTCFullYear()}; }
function dkey(d){ return d.getUTCFullYear()+"-"+d.getUTCMonth()+"-"+d.getUTCDate(); }
function calEvents(){
  const ev={}, ne=nextEvent();
  for(let r=0;r<S.fixtures.length;r++){ const {m}=myFixture(r); if(m.includes("bye")) continue;
    const d=mDateObj(r), home=m[0]==="you", oppId=home?m[1]:m[0];
    const i=S.fixtures[r].findIndex(x=>x.includes("you")), sc=S.results[r]&&S.results[r][i];
    let result=null,k=null; if(sc){ const mine=home?sc[0]:sc[1],th=home?sc[1]:sc[0]; result=[sc[0],sc[1]]; k=mine>th?"W":mine<th?"L":"D"; }
    ev[dkey(d)]={comp:"league",oppId,home,result,k,isNext:(ne&&ne.type==="league"&&r===S.round)};
  }
  if(S.cup){ S.cup.rounds.forEach((t,idx)=>{
    const show = t.played || (idx===S.cup.idx && !S.cup.out && !S.cup.won);
    if(!show) return;
    let result=null,k=null; if(t.played){ result=t.score; k=t.won?"W":"L"; }
    ev[dkey(new Date(cupDate(t.week)))]={comp:"cup",oppId:t.opp,home:(t.name==="Final"?null:t.home),result,k,round:t.name,isNext:(ne&&ne.type==="cup"&&idx===S.cup.idx)};
  }); }
  return ev;
}
function monthGrid(y,mo,ev,nowDay){
  const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const WD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const lead=(new Date(Date.UTC(y,mo,1)).getUTCDay()+6)%7, days=new Date(Date.UTC(y,mo+1,0)).getUTCDate();
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<div class="cday empty"></div>`;
  for(let dn=1;dn<=days;dn++){ const e=ev[y+"-"+mo+"-"+dn];
    const past = Date.UTC(y,mo,dn) < nowDay;
    if(!e){ cells+=`<div class="cday${past?" past":""}"><span class="cdn">${dn}</span></div>`; continue; }
    const t=teamInfo(e.oppId), ha=e.home==null?"N":e.home?"H":"A";
    cells+=`<div class="cday match ${e.comp}${e.isNext?" next":""}${e.k?" r"+e.k:""}${past?" past":""}" title="${esc(t.name)} (${e.comp==="cup"?"League Cup":"Premier League"})">
      <span class="ctop"><span class="cdn">${dn}</span><span class="ctag ${e.comp}">${e.comp==="cup"?"CUP":"LGE"}</span></span>
      <span class="cmx">${crest(t.c1,t.c2,t.short,15)}<span class="cop">${esc(t.short)}</span><span class="cha">${ha}</span></span>
      <span class="cres">${e.result?e.result[0]+"\u2013"+e.result[1]:(e.isNext?"NEXT":ha)}</span>
    </div>`;
  }
  return `<div class="cmonth"><div class="cmhead">${MN[mo]} ${y}</div><div class="cgh">${WD.map(w=>`<span>${w}</span>`).join("")}</div><div class="cgrid">${cells}</div></div>`;
}

/* ---------- events ---------- */
function bind(){
  document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.view;ui.slot=null;render();window.scrollTo(0,0);if(view==="admin"&&rosterCache!=="na")loadRoster()}));

    if(act==="formation"){el.addEventListener("change",()=>{S.formation=el.value;autoPick();save();render()});return}
    el.addEventListener("click",()=>handle(act,el));
  });
}
function handle(act,el){
  switch(act){
    case "play": advance(); break;
    case "buy": openPack(PACKS.find(p=>p.id===el.dataset.pack)); break;
    case "auto": autoPick(); ui.slot=null; save(); render(); toast("Best XI selected"); break;
    case "slot": {
      const i=+el.dataset.i;
      if(ui.slot===null) ui.slot=i;
      else if(ui.slot===i) ui.slot=null;
      else { const t=S.xi[ui.slot]; S.xi[ui.slot]=S.xi[i]; S.xi[i]=t; ui.slot=null; save(); toast("Positions swapped"); }
      render(); break;
    }
    case "cancelslot": ui.slot=null; render(); break;
    case "pcard": {
      const id=el.dataset.id;
      if(ui.slot!==null){
        const prev=S.xi.indexOf(id);
        if(prev>=0) S.xi[prev]=S.xi[ui.slot];
        S.xi[ui.slot]=id; ui.slot=null; ui.sel=null; save();
        const np=byId(id); toast(`${surname(np.n)} on`);
      } else ui.sel = ui.sel===id?null:id;
      render(); break;
    }
    case "subin": {
      const p=byId(el.dataset.id); if(!p) return;
      const sls=slots();
      let idx = sls.findIndex(([pos],i)=>!S.xi[i] && pos===p.pos);
      if(idx<0) idx = sls.findIndex((x,i)=>!S.xi[i]);
      if(idx<0){
        let li=-1,lo=1e9;
        sls.forEach(([pos],i)=>{ if(pos===p.pos){const cur=byId(S.xi[i]); const e=cur?effective(cur,pos):0; if(e<lo){lo=e;li=i;}} });
        if(li>=0 && effective(p,sls[li][0])>lo) idx=li;
        if(idx<0){ li=-1;lo=1e9; sls.forEach(([pos],i)=>{const cur=byId(S.xi[i]); const e=cur?effective(cur,pos):0; if(e<lo){lo=e;li=i;}}); if(li>=0 && effective(p,sls[li][0])>lo) idx=li; }
      }
      if(idx<0){ toast("No clear upgrade — tap a pitch position to place them."); return; }
      S.xi[idx]=p.id; ui.sel=null; save(); render(); toast(`${surname(p.n)} into the XI`); break;
    }
    case "desel": ui.sel=null; render(); break;
    case "sell": {
      const pl=byId(el.dataset.id); if(!pl||S.squad.length<=11) return;
      const fee=value(pl.ovr); S.budget+=fee; S.squad=S.squad.filter(x=>x.id!==pl.id); S.xi=S.xi.map(x=>x===pl.id?null:x); ui.sel=null; save(); render();
      toast(`Sold ${surname(pl.n)} for ${money(fee)} \u2014 straight into the bank.`); break;
    }
    case "filter": ui.filter=el.dataset.f; render(); break;
    case "reset": ui.confirmReset=true; render(); break;
    case "reset-no": ui.confirmReset=false; render(); break;
    case "reset-yes": ui.confirmReset=false; resetClub(); break;
    case "next-season": nextSeason(); break;
    case "admin-refresh": rosterCache=null; render(); loadRoster(); break;
  }
}

/* ---------- pack opening ---------- */
function openPack(pk){
  if(S.budget<pk.price||S.squad.length+pk.count>MAX_SQUAD) return;
  S.budget-=pk.price; S.packs++;
  const got=[];
  const add=(t,min,hi,pos)=>{ const p=drawReal(t,pk.lo,hi||pk.hi,min,pos)||makePlayer(t,pos); got.push(p); S.squad.push(p) };
  // the headline pull first, so the guarantee holds even as the pool thins; steer it to a needed position
  if(pk.guar) add(ri(pk.guar,pk.hi),pk.guar,null,gapPos());
  while(got.length<pk.count) add(rollOvr(pk.lo,pk.hi),null,null,gapPos());
  got.sort((a,b)=>a.ovr-b.ovr);
  const topPull=got[got.length-1]; if(topPull && topPull.ovr>=86) S.lastStar=topPull.n;
  save();

  const ov=document.createElement("div"); ov.className="overlay"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-label",pk.name+" pack");
  const top=got[got.length-1];
  ov.style.setProperty("--glow", top.ovr>=84?"rgba(198,60,92,.35)":top.ovr>=75?"rgba(233,196,92,.28)":"rgba(185,195,208,.18)");
  ov.innerHTML=`<span class="eyebrow">${pk.name} pack</span><button class="sealed ${pk.foil}" id="seal" aria-label="Tear open the pack"><span>${pk.name}<br><small style="font-size:18px">Tap to open</small></span></button>`;
  document.body.appendChild(ov);
  const seal=ov.querySelector("#seal"); seal.focus();
  let opened=false;
  seal.addEventListener("click",()=>{
    if(opened) return; opened=true;
    seal.classList.add("shake");
    setTimeout(()=>{
      ov.innerHTML=`<span class="eyebrow">${pk.name} pack · ${got.length} players</span>
        <div class="reveal">${got.map((p,i)=>`<div class="flip" data-i="${i}"><div class="in"><div class="back ${pk.foil}"><span>?</span></div><div class="front">${card(p)}</div></div></div>`).join("")}</div>
        <div class="row" id="pkact" hidden><button class="btn primary" id="done">Add to squad</button></div>
        <p class="muted" id="pkmsg" style="margin:0"></p>`;
      const flips=[...ov.querySelectorAll(".flip")];
      const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
      flips.forEach((f,i)=>setTimeout(()=>f.classList.add("open"), reduce?0:350+i*(i===flips.length-1?700:520)));
      setTimeout(()=>{
        ov.querySelector("#pkact").hidden=false;
        const b=top; ov.querySelector("#pkmsg").textContent = b.ovr>=86?`Elite signing: ${b.n}, rated ${b.ovr}.`:`Best pull: ${b.n} (${b.ovr} ${b.pos}).`;
        ov.querySelector("#done").focus();
      }, reduce?50:350+flips.length*520+600);
      ov.querySelector("#done").addEventListener("click",()=>{ov.remove();autoPickIfBetter();render()});
    }, matchMedia("(prefers-reduced-motion: reduce)").matches?0:480);
  });
}
function autoPickIfBetter(){

  if(teamRatings().ovr<=before+0.01) S.xi=keep; else toast("New signings moved into your best XI");

}

function simMatch(h,a){
  const [lh,la]=lambdas(h,a), gh=poisson(lh), ga=poisson(la);
  const events=[];
  for(let k=0;k<gh;k++) events.push({min:ri(1,90),team:h,goal:true});
  for(let k=0;k<ga;k++) events.push({min:ri(1,90),team:a,goal:true});
  const chances=["fires just wide","forces a fine save","hits the post","has a header cleared off the line","sees a shot blocked"];
  for(let k=0;k<ri(3,6);k++) events.push({min:ri(1,90),team:Math.random()<lh/(lh+la)?h:a,goal:false,txt:pick(chances)});
  events.sort((x,y)=>x.min-y.min);
  events.forEach(e=>{ if(e.goal) e.who=scorer(e.team) });
  return {lh,la,gh,ga,events};
}

function makeCup(base){

    return {name:n, week:base+offs[i], opp, home:(n==="Final")?true:Math.random()<0.5, played:false, score:null, won:null, pens:null}; });

  const yes=ov.querySelector(".enjoy-yes"), no=ov.querySelector(".enjoy-no");
  const place=(x,y)=>{ const m=14,bw=no.offsetWidth||64,bh=no.offsetHeight||64;
    no.style.left=clamp(x,m,innerWidth-bw-m)+"px"; no.style.top=clamp(y,m,innerHeight-bh-m)+"px"; };
  requestAnimationFrame(()=>{ const r=yes.getBoundingClientRect(); place(r.right+18, r.top); });
  let n=0;
  const flee=()=>{ n++; const bw=no.offsetWidth||64,bh=no.offsetHeight||64;
    place(14+Math.random()*(innerWidth-bw-28), 14+Math.random()*(innerHeight-bh-28));
    if(n===4) no.textContent="😅"; if(n===8) no.textContent="🙈"; };
  no.addEventListener("pointerenter",flee);
  no.addEventListener("pointerdown",e=>{e.preventDefault();flee()});
  no.addEventListener("touchstart",e=>{e.preventDefault();flee()},{passive:false});
  no.addEventListener("click",e=>{e.preventDefault();flee()});
  ov.addEventListener("pointermove",e=>{ const r=no.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    if(Math.hypot(e.clientX-cx,e.clientY-cy)<95) flee(); });
  window.addEventListener("resize",()=>{ const r=no.getBoundingClientRect(); place(r.left,r.top) });
  yes.addEventListener("click",()=>{
    try{ localStorage.setItem("tt-enjoy-done","1") }catch(e){}
    ov.classList.add("bye"); toast("Brilliant — enjoy the season! ⚽"); setTimeout(()=>ov.remove(),300);
  });
  yes.focus();
}

/* ---------- boot ---------- */
async function connect(){
  if(!window.claude || !window.claude.use){ store.kind="local"; return }
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const id = user ? await user.id() : null;
    if(db && id){ const me=await user.me(); store={kind:"db",db,uid:id,me}; isAdmin=!!(me&&me.isOwner) }
    else store.kind="local";
  }catch(e){ store.kind="local" }
}
function start(data){
  if(data && data.S){ S=data.S; view=data.view||"club" }
  render();
  const guard=setTimeout(()=>{ if(store.kind==="memory"){store.kind="local"; finishLoad()} },10000);
  connect().then(()=>{clearTimeout(guard); finishLoad()});
}
let loaded=false;
async function finishLoad(){
  if(loaded) return; loaded=true;
  try{ const saved=await load(); if(saved && saved.v===2){ if(!saved.h2h) saved.h2h={}; if(saved.januaryDone===undefined) saved.januaryDone=false; if(!saved.records) saved.records={bestWin:null}; if(saved.cupTrophies===undefined) saved.cupTrophies=0; if(!saved.cup) saved.cup=makeCup(Math.max(4, saved.round+2)); saved.squad.forEach(p=>{ if(!p.a||Object.keys(p.a).length<6) p.a=attrsFor(p.ovr,p.pos,p.rid) }); }
    if(saved && saved.v===2){ if(!saved.club.stadium) saved.club.stadium=saved.club.name+" Stadium"; }
    if(saved && saved.v===2 && (!S || (saved.round+saved.season*100)>=(S.round+S.season*100))) S=saved; }
  catch(e){ toast("Couldn't load your saved club. Try reloading the page.") }
  // one-time only: upgrade a pre-mixed-schedule save (then never touch fixtures again, so refreshing can't change your opponent)
  if(S && S.fixtures && !S.schedFixed){
    let played=false;
    for(let r=0;r<S.round;r++){ if(!myFixture(r).m.includes("bye")){ played=true; break } }
    if(!played){ S.round=0; S.results=[]; S.fixtures=makeFixtures(["you"].concat(S.teams.map(t=>t.id))); advanceByes(); }
    S.schedFixed=true; save();
  }
  render();
}
if(window.claude && window.claude.hot && window.claude.hot.snapshot){ try{ window.claude.hot.snapshot(()=>({S,view})) }catch(e){} }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
